name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Create API key properties stub
      run: |
        echo "MAPS_API_KEY=stub_key" >> local.properties
        echo "OAUTH_CLIENT_ID=\"stub_client_id\"" >> local.properties
        echo "GEMINI_API_KEY=\"stub_gemini_key\"" >> local.properties

    - name: Run Build & Static Analysis
      run: ./gradlew assembleDebug

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest
